version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: indomim_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: indomim_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_PATH=/data/traccc.db
      - MQTT_URL=mqtt://mosquitto:1883
    volumes:
      - traccc_data:/data
    depends_on:
      - mosquitto

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: indomim_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  traccc_data:
